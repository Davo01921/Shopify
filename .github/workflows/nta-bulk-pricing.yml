name: TierWeave

on:
  push:
    branches:
      - feat/tierweave-cloudflare
    paths:
      - "nta-bulk-pricing/**"
      - ".github/workflows/nta-bulk-pricing.yml"
  pull_request:
    paths:
      - "nta-bulk-pricing/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nta-bulk-pricing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: nta-bulk-pricing/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @shopify/cli@4.8.2
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run cf-build
