name: DALUA catalogue scrape

on:
  workflow_dispatch:
  push:
    branches:
      - codex/dalua-catalog-scraper
    paths:
      - 'dalua_scraper/store_api_scraper.py'
      - 'dalua_scraper/scrape_dalua.py'
      - 'dalua_scraper/requirements.txt'
      - '.github/workflows/dalua-catalog.yml'
  schedule:
    - cron: '15 18 * * 0'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dalua-catalog-scraper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r dalua_scraper/requirements.txt
      - name: Scrape DALUA
        id: scrape
        continue-on-error: true
        run: |
          mkdir -p dalua_scraper/output
          set -o pipefail
          python dalua_scraper/store_api_scraper.py 2>&1 | tee dalua_scraper/output/run.log
      - name: Validate catalogue
        id: validate
        if: steps.scrape.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee dalua_scraper/output/validation.log
          import csv, json
          from pathlib import Path
          p=Path('dalua_scraper/output')
          s=json.loads((p/'summary.json').read_text())
          rows=list(csv.DictReader((p/'dalua_catalog.csv').open(encoding='utf-8-sig')))
          assert s['prices_ex_gst_confirmed'] is True, s
          assert s['gst_rate'] == '10%', s
          assert s['price_crosscheck_compared'] >= 5, s
          assert s['price_crosscheck_matches'] == s['price_crosscheck_compared'], s
          assert len(rows) >= 450, f"catalogue unexpectedly small: {len(rows)}"
          assert all(r['title'] for r in rows), 'missing title'
          assert all(r['regular_cost_ex_gst'] for r in rows), 'missing ex-GST cost'
          assert all(r['regular_cost_plus_gst'] for r in rows), 'missing GST-inclusive cost'
          assert s['with_images'] >= int(len(rows)*0.90), s
          assert s['with_descriptions'] >= int(len(rows)*0.80), s
          print('VALIDATED', s)
          PY
      - name: Persist outputs and diagnostics
        if: always()
        run: |
          printf '{"scrape":"%s","validate":"%s"}\n' '${{ steps.scrape.outcome }}' '${{ steps.validate.outcome }}' > dalua_scraper/output/workflow_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dalua_scraper/output/
          git diff --cached --quiet && exit 0
          git commit -m "Update DALUA scrape output"
          git push origin HEAD:codex/dalua-catalog-scraper
      - name: Enforce success
        if: steps.scrape.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1
