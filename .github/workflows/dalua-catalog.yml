name: DALUA catalogue scrape

on:
  workflow_dispatch:
  push:
    branches:
      - codex/dalua-catalog-scraper
    paths:
      - 'dalua_scraper/**'
      - '.github/workflows/dalua-catalog.yml'
  schedule:
    - cron: '15 18 * * 0'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dalua_scraper/requirements.txt
      - run: pip install -r dalua_scraper/requirements.txt
      - name: Scrape DALUA
        run: python dalua_scraper/scrape_dalua.py
      - name: Validate catalogue
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('dalua_scraper/output')
          s=json.loads((p/'summary.json').read_text())
          rows=list(csv.DictReader((p/'dalua_catalog.csv').open(encoding='utf-8-sig')))
          assert s['prices_ex_gst_confirmed'] is True, s
          assert s['gst_rate'] == '10%', s
          assert s['table_pages_reported'] >= 40, s
          assert s['pages_with_rows'] == s['table_pages_reported'], s
          assert len(rows) >= 450, f"catalogue unexpectedly small: {len(rows)}"
          assert all(r['title'] for r in rows), 'missing title'
          assert all(r['regular_cost_ex_gst'] for r in rows), 'missing ex-GST cost'
          assert all(r['regular_cost_plus_gst'] for r in rows), 'missing GST-inclusive cost'
          assert s['with_images'] >= int(len(rows)*0.90), s
          assert s['with_descriptions'] >= int(len(rows)*0.80), s
          assert s['with_stock_status'] >= int(len(rows)*0.90), s
          print('VALIDATED', s)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dalua-catalog-${{ github.run_id }}
          path: dalua_scraper/output/
          if-no-files-found: error
          retention-days: 30
